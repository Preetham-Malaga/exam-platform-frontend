    function vSylTiles() {
      const v = VS();
      if (v.conv)
        return `${ph(SYL, SYL, 'Answer a few quick questions, one at a time.')}${convView()}`;
      const tiles = S.courses
        .map((c, i) => {
          const tps = c.subjects.flatMap((s) => s.topics),
            cov = tps.length
              ? Math.round((tps.filter((t) => topicQ(t.id) > 0).length / tps.length) * 100)
              : 0,
            tone = ['butter', 'lav', 'mint', 'peach', 'sky', 'pink'].at(i % 6),
            open = v.tileOpen === c.id;
          return `<button type="button" class="tile t-${tone}" style="cursor:pointer;text-align:left;min-height:190px;${open ? 'outline:3px solid var(--focus);outline-offset:3px' : ''}" data-act="tile-open" data-id="${c.id}" aria-expanded="${open}" data-testid="tiles-course-tile" data-entity-id="${c.id}" data-entity-code="${c.code}"><span style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%"><span class="code">${e(c.code)}</span><span style="width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ink) 0 ${cov}%, var(--surface-2) ${cov}% 100%);display:grid;place-items:center" role="img" aria-label="${cov}% of topics have questions"><span style="width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink)">${cov}%</span></span></span><span style="font-family:var(--display);font-size:30px;font-weight:800;line-height:1">${e(c.name)}</span><span class="chip" style="align-self:flex-start;cursor:inherit">${c.subjects.length} subjects · ${tps.length} topics</span></button>`;
        })
        .join('');
      const oc = course(v.tileOpen);
      const detail = oc
        ? `<section class="card" data-testid="tiles-course-detail" data-entity-id="${oc.id}"><div class="card-h"><h2>${e(oc.name)} · subjects</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="#form-course-${oc.id}" data-testid="tiles-edit-course-btn">Edit course</a><button type="button" class="btn btn-primary btn-sm" data-act="conv-start" data-ent="subject" data-pid="${oc.id}" data-testid="tiles-add-subject-btn">${ic('plus', 14)}Add subject</button></div></div>
    <div class="grid g3">${oc.subjects.map((s, j) => `<div class="q-card sticker" style="transform:rotate(${[-1, 0.8, -0.4, 1.1].at(j % 4)}deg)" data-testid="tiles-subject-card" data-entity-id="${s.id}"><span class="code on-row" style="align-self:flex-start">${e(s.code)}</span><b style="font-size:18px">${e(s.name)}</b><div class="chips">${s.topics.map((t) => `<span class="pill b-neutral" data-testid="tiles-topic-chip">${e(t.name)}</span>`).join('')}<a class="pill b-lav" href="#form-topic-${s.id}" data-testid="tiles-add-topic-link">+ topic</a></div><span class="hint">${qCountSubj(s.id)} questions</span></div>`).join('') || '<div class="empty"><b>No subjects yet</b></div>'}</div></section>`
        : '';
      return `${ph(SYL, SYL, 'Tap a course tile to open it. The ring shows how many of its topics already have questions.', `<button type="button" class="btn btn-primary" data-act="conv-start" data-ent="course" data-testid="tiles-add-course-btn">${ic('plus')}Add course</button>`)}
  <section class="grid g3" data-testid="tiles-grid">${tiles}<button type="button" class="add-tile" style="min-height:190px" data-act="conv-start" data-ent="course" data-testid="tiles-add-course-tile"><span class="plus">+</span>Add a course</button></section>${detail}`;
    }
    /* Playground · DECK question bank: course decks → flashcards */
    function vQBDeck() {
      const v = VS(),
        c = course(v.deck);
      if (!c)
        return `${qbHead('Pick a deck and flip through its questions like flashcards — check each answer, then fix what needs work.')}
  <section class="grid g3" data-testid="questions-deck-grid">${S.courses
    .map((x, i) => {
      const qs = qOfCourse(x),
        tone = ['butter', 'lav', 'mint', 'peach', 'sky', 'pink'].at(i % 6);
      return `<button type="button" class="tile t-${tone}" style="cursor:pointer;text-align:left;min-height:180px" data-act="deck-open" data-id="${x.id}" data-testid="questions-deck-card" data-entity-id="${x.id}" data-entity-code="${x.code}"><span class="lbl">${e(x.code)} · ${x.subjects.length} subjects</span><span style="font-family:var(--display);font-size:32px;font-weight:800;line-height:1">${e(x.name)}</span><span style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip" style="cursor:inherit">${qs.length} cards</span><span class="chip" style="cursor:inherit">${qs.filter((q) => q.status === 'Draft').length} drafts</span></span></button>`;
    })
    .join(
      '',
    )}<a class="add-tile" href="#question-new" style="min-height:180px;text-decoration:none" data-testid="questions-new-card"><span class="plus">+</span>New question</a></section>`;
      const qs = qOfCourse(c);
      v.di = Math.max(0, Math.min(v.di || 0, qs.length - 1));
      const q = qs[v.di];
      const head = ph(
        `<button type="button" class="linkish" data-act="deck-back" data-testid="questions-back-to-decks-btn">Question Bank</button> › ${e(c.name)} deck`,
        `${e(c.name)} deck`,
        qs.length ? `Card ${v.di + 1} of ${qs.length}` : 'No cards yet',
        `<button type="button" class="btn btn-ghost" data-act="deck-grid" aria-pressed="${!!v.deckGrid}" data-testid="questions-deck-grid-toggle-btn">${v.deckGrid ? 'One at a time' : 'See all cards'}</button><a class="btn btn-primary" href="#question-new" data-testid="questions-new-btn">${ic('plus')}New question</a>`,
      );
      if (!q)
        return (
          head +
          '<div class="card"><div class="empty"><b>This deck is empty</b><a href="#question-new">Add the first question</a></div></div>'
        );
      if (v.deckGrid)
        return `${head}<section class="grid g3" data-testid="questions-deck-all">${qs.map((x, i) => `<button type="button" class="q-card sticker" style="cursor:pointer;text-align:left;color:var(--ink)" data-act="deck-go" data-i="${i}" data-testid="questions-deck-mini-card" data-entity-id="${x.id}"><span class="hint">Card ${i + 1} · ${e(subj(x.subject)?.name)}</span><b class="clamp2">${e(x.text)}</b><span class="chips">${diffPill(x.diff)}${statusPill(x.status)}</span></button>`).join('')}</section>`;
      return `${head}<div class="progress" role="progressbar" aria-valuenow="${v.di + 1}" aria-valuemin="1" aria-valuemax="${qs.length}" aria-label="Deck progress"><i style="width:${((v.di + 1) / qs.length) * 100}%"></i></div>
  <section class="card flash" data-testid="questions-flashcard" data-entity-id="${q.id}" data-flipped="${!!v.flip}"><div class="card-h"><span class="pill b-lav">${e(subj(q.subject)?.name)} · ${e(topicName(q.topic))}</span><span class="chips">${diffPill(q.diff)}${statusPill(q.status)}<span class="pill b-neutral">+${q.marks}</span></span></div>
  <h2 style="font-family:var(--display);font-size:clamp(22px,3vw,32px);line-height:1.25">${e(q.text)}</h2>${optList(q, !!v.flip)}
  ${v.flip ? `<div class="note" style="background:var(--mint);color:var(--mint-ink)" data-testid="questions-flashcard-answer">Answer: <b>${LET[q.correct]} · ${e(q.options[q.correct])}</b></div>` : ''}
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><button type="button" class="btn btn-ghost" data-act="deck-nav" data-d="-1" ${v.di === 0 ? 'disabled' : ''} data-testid="questions-flashcard-prev-btn">← Previous</button><button type="button" class="btn btn-primary" data-act="deck-flip" aria-pressed="${!!v.flip}" data-testid="questions-flashcard-flip-btn">${v.flip ? 'Hide answer' : 'Show answer'}</button><button type="button" class="btn btn-ghost" data-act="deck-nav" data-d="1" ${v.di >= qs.length - 1 ? 'disabled' : ''} data-testid="questions-flashcard-next-btn">Next →</button></div>
  ${qActions(q)}</section>`;
    }
    const SYLV = {
      columns: vSylColumns,
      catalogue: vSylCatalogue,
      map: vSylMap,
      sheet: vSylSheet,
      tiles: vSylTiles,
    };
    const QBV = {
      split: vQBSplit,
      drill: vQBDrill,
      board: vQBBoard,
      table: vQBTable,
      deck: vQBDeck,
    };

    /* ---------- render ---------- */
    function render() {
      const r = S.route;
      document
        .querySelectorAll('.proto button[data-role]')
        .forEach((b) =>
          b.setAttribute(
            'aria-pressed',
            String(
              (AUTH.includes(r) && b.dataset.role === 'login') ||
                (!AUTH.includes(r) && b.dataset.role === S.role),
            ),
          ),
        );
      $('#proto-clock').textContent =
        `Prototype clock: ${fmtDate('2026-10-28')} · ${fmtTime('19:05')} IST`;
      document.documentElement.setAttribute('data-brand', S.org.brand);
      let html;
      if (r === 'login') html = vLogin();
      else if (r === 'signup') html = vSignupFull();
      else if (r === 'pending') html = vPending();
      else if (r === 'forgot') html = vForgot();
      else {
        const allowed = (NAV[S.role] || []).flatMap((x) =>
          x.g ? x.items.map((i) => i.id) : [x.id],
        );
        let v;
        if (r === 'take-exam' && S.role === 'student') v = vTake();
        else if (r.startsWith('exam-') && S.role !== 'student') v = vExam(r.slice(5));
        else if (r.startsWith('question-') && S.role !== 'student')
          v = vForm('question', r.slice(9) === 'new' ? '' : r.slice(9));
        else if (r.startsWith('form-') && S.role !== 'student') {
          const m = r.match(/^form-([a-z]+)(?:-(.+))?$/);
          v =
            m && SPEC[m[1]] && !['signup', 'organization'].includes(m[1])
              ? vForm(m[1], m[2] || '')
              : vDashboard();
        } else if (r === 'fields') v = vFields();
        else if (!allowed.includes(r)) {
          v = S.role === 'student' ? vHome() : vDashboard();
        } else
          v = {
            dashboard: vDashboard,
            syllabus: SYLV[THEME.syl] || vSyllabus,
            questions: QBV[THEME.qb] || vQuestions,
            exams: vExams,
            live: vLive,
            recorded: vRecorded,
            materials: vMaterials,
            students: vStudents,
            teachers: vTeachers,
            batches: vBatches,
            admins: vAdmins,
            results: vResults,
            leaderboard: vLeaderboard,
            reports: vReports,
            'org-profile': vOrg,
            roles: vRoles,
            alerts: vAlerts,
            home: vHome,
            'my-exams': vMyExams,
            'my-results': vResults,
          }[r]();
        html = shell(v);
      }
      $('#app').innerHTML = html;
      const auto = document.getElementById('f-name');
      if (auto && S.ui.add) auto.focus({ preventScroll: false });
    }

    /* ---------- actions ---------- */
    const findNode = (id) => {
      for (const c of S.courses) {
        if (c.id === id) return { node: c, list: S.courses };
        for (const s of c.subjects) if (s.id === id) return { node: s, list: c.subjects };
      }
      return null;
    };
    const val = (id) => (document.getElementById(id)?.value || '').trim();
    function codeOk(pool) {
      const name = val('f-name'),
        code = val('f-code').toUpperCase(),
        hint = document.getElementById('f-hint');
      const taken = (pools[pool]?.() || []).includes(code);
      if (hint) {
        if (!name) {
          hint.className = 'hint';
          hint.textContent = 'Type a name — we suggest a short code you can change.';
        } else if (taken) {
          hint.className = 'hint bad';
          hint.textContent = `Code ${code} is already used — try another.`;
        } else if (code) {
          hint.className = 'hint ok';
          hint.textContent = `✓ Code ${code} is free in your organization`;
        }
      }
      return !!name && !!code && !taken;
    }
    const A = {
      as(el) {
        const r = el.dataset.role;
        if (r === 'login') {
          S.role = null;
          go('login');
        } else {
          S.role = r;
          S.take = null;
          go(r === 'student' ? 'home' : 'dashboard');
        }
      },
      menu() {
        S.ui.menu = !S.ui.menu;
        render();
      },
      grp(el) {
        const g = el.dataset.g;
        const nv = !(S.ui.groups[g] ?? false);
        if (THEME.groupsClosed) S.ui.groups = {};
        S.ui.groups[g] = nv;
        render();
      },
      logout() {
        S.role = null;
        go('login');
      },
      pw() {
        S.ui.pw = !S.ui.pw;
        render();
      },
      approve() {
        toast('Organization approved. You can log in now.');
        go('login');
      },
      'hide-setup'() {
        S.ui.showSetup = false;
        render();
      },
      'reset-filters'() {
        S.filters = { range: '30', batch: 'all', course: 'all', exam: 'all' };
        render();
      },
      pdf(el) {
        toast(
          `${el.dataset.name}_${fmtDate('2026-10-28').replace(/[ /]/g, '-')}.pdf is ready (prototype — the real app downloads an A4 PDF with your logo).`,
        );
      },
      'new-exam-go'() {
        S.ui.newExam = true;
        S.ui.examTab = 'draft';
        S.ui.pendingAdd = { kind: 'exam' };
      },
      add(el) {
        S.ui.add = { kind: el.dataset.kind, parent: el.dataset.parent };
        S.ui.confirm = null;
        S.ui.form = null;
        S.ui.fe = {};
        render();
        const fi = document.querySelector(
          '.inline-form input[data-fk]:not([type="file"]), .inline-form select[data-fk]',
        );
        if (fi && !document.getElementById('f-name')) {
          fi.closest('.inline-form').scrollIntoView({ block: 'nearest' });
          fi.focus({ preventScroll: true });
        }
      },
      'close-add'() {
        S.ui.add = null;
        S.ui.newExam = false;
        S.ui.form = null;
        S.ui.fe = {};
        render();
      },
      toggle(el) {
        const n = findNode(el.dataset.id);
        n.node.open = !n.node.open;
        render();
      },
      rename(el) {
        S.ui.renaming = el.dataset.id;
        render();
        const i = document.getElementById('rn-' + el.dataset.id);
        if (i) {
          i.focus();
          i.select();
        }
      },
      'ask-del'(el) {
        S.ui.confirm = el.dataset.id;
        render();
      },
      'cancel-confirm'() {
        S.ui.confirm = null;
        render();
      },
      'del-node'(el) {
        const n = findNode(el.dataset.id);
        const idx = n.list.indexOf(n.node);
        n.list.splice(idx, 1);
        S.ui.confirm = null;
        render();
        toast(`${n.node.name} deleted`, { undo: () => n.list.splice(idx, 0, n.node) });
      },
      'del-topic'(el) {
        const s = subj(el.dataset.s);
        const idx = s.topics.findIndex((t) => t.id === el.dataset.id);
        const [t] = s.topics.splice(idx, 1);
        render();
        toast(`Topic ${t.name} deleted`, { undo: () => s.topics.splice(idx, 0, t) });
      },
      'save-course'() {
        if (!codeOk('course')) {
          document.getElementById('f-name').focus();
          return;
        }
        S.courses.push({
          id: uid('c'),
          name: val('f-name'),
          code: val('f-code').toUpperCase(),
          open: true,
          subjects: [],
        });
        toast(`Course ${val('f-name')} added`);
        render();
      },
      'save-subject'(el) {
        if (!codeOk('subject')) return;
        const c = course(el.dataset.id);
        c.subjects.push({
          id: uid('s'),
          name: val('f-name'),
          code: val('f-code').toUpperCase(),
          open: true,
          topics: [],
        });
        toast(`Subject ${val('f-name')} added to ${c.name}`);
        render();
      },
      'save-topic'(el) {
        const n = val('f-name');
        if (!n) return;
        subj(el.dataset.id).topics.push({ id: uid('t'), name: n });
        render();
      },
      'del-q'(el) {
        const idx = S.questions.findIndex((q) => q.id === el.dataset.id);
        const [q] = S.questions.splice(idx, 1);
        S.ui.confirm = null;
        render();
        toast('Question deleted', { undo: () => S.questions.splice(idx, 0, q) });
      },
      'qe-correct'(el) {
        S.ui.qe.correct = Number(el.dataset.i);
        render();
      },
      'qe-add-opt'() {
        S.ui.qe.options.push('');
        render();
      },
      'qe-del-opt'(el) {
        const i = Number(el.dataset.i);
        S.ui.qe.options.splice(i, 1);
        if (S.ui.qe.correct >= S.ui.qe.options.length) S.ui.qe.correct = 0;
        render();
      },
      'qe-new-cancel'() {
        S.ui.qeNew = null;
        render();
      },
      'qe-new-save'() {
        const n = val('f-name');
        if (!n) return;
        const d = S.ui.qe;
        if (S.ui.qeNew === 'topic') {
          const t = { id: uid('t'), name: n };
          subj(d.subject).topics.push(t);
          d.topic = t.id;
        } else {
          const s = { id: uid('s'), name: n, code: autoCode(n), open: false, topics: [] };
          courseOfSubj(d.subject).subjects.push(s);
          d.subject = s.id;
          d.topic = '';
        }
        S.ui.qeNew = null;
        toast(`${n} created and selected`);
        render();
      },
      'qe-save'(el) {
        const d = S.ui.qe,
          mode = el.dataset.mode;
        if (!d.text.trim()) {
          const er = document.getElementById('qe-text-err');
          er.hidden = false;
          document.getElementById('qe-text').focus();
          return;
        }
        const rec = Object.assign({}, d, { status: mode === 'draft' ? 'Draft' : 'Published' });
        delete rec.src;
        if (d.id === 'new') {
          rec.id = uid('q');
          S.questions.unshift(rec);
        } else
          Object.assign(
            S.questions.find((q) => q.id === d.id),
            rec,
          );
        toast(mode === 'draft' ? 'Saved as draft' : 'Question published');
        if (mode === 'another') {
          S.ui.qe = null;
          if (location.hash !== '#question-new') go('question-new');
          else render();
        } else {
          S.ui.qe = null;
          go('questions');
        }
      },
      'exam-tab'(el) {
        S.ui.examTab = el.dataset.t;
        render();
      },
      'new-exam'() {
        S.ui.newExam = true;
        S.ui.add = { kind: 'exam' };
        render();
      },
      'save-exam'() {
        if (!codeOk('exam')) return;
        const x = {
          id: uid('e'),
          name: val('f-name'),
          code: val('f-code').toUpperCase(),
          course: val('f-course'),
          status: 'draft',
          qs: [],
          assign: { mode: 'none', batches: [] },
          duration: 60,
          pass: 40,
          opens: '',
          closes: '',
          attempts: 0,
          allowed: 1,
          shuffleQ: false,
          shuffleO: false,
          showRes: true,
          showAns: false,
          board: false,
        };
        S.exams.push(x);
        S.ui.newExam = false;
        S.ui.examPage = 'details';
        toast(`Draft ${x.name} created`);
        go('exam-' + x.id);
      },
      'del-exam'(el) {
        const idx = S.exams.findIndex((x) => x.id === el.dataset.id);
        const [x] = S.exams.splice(idx, 1);
        S.ui.confirm = null;
        render();
        toast(`${x.name} deleted`, { undo: () => S.exams.splice(idx, 0, x) });
      },
      'dup-exam'(el) {
        const o = exam(el.dataset.id);
        const x = JSON.parse(JSON.stringify(o));
        x.id = uid('e');
        x.name = o.name + ' (copy)';
        x.code = (o.code + '2').slice(0, 8);
        x.status = 'draft';
        x.attempts = 0;
        x.opens = '';
        x.closes = '';
        S.exams.push(x);
        S.ui.examPage = 'details';
        toast('Duplicated as a new draft');
        go('exam-' + x.id);
      },
      unpublish(el) {
        exam(el.dataset.id).status = 'draft';
        toast('Unpublished — you can edit it now');
        if (S.route.startsWith('exam-')) render();
        else {
          S.ui.examTab = 'draft';
          render();
        }
      },
      'exam-page'(el) {
        S.ui.examPage = el.dataset.t;
        render();
      },
      publish(el) {
        const x = exam(el.dataset.id);
        const ok =
          x.qs.length &&
          (x.assign.mode === 'everyone' || x.assign.batches.length) &&
          x.opens &&
          x.closes;
        if (!ok) {
          toast('Finish the checklist first: questions, assignment and exam window.', {
            err: true,
          });
          return;
        }
        x.status = 'published';
        toast(`${x.name} published — ${reach(x)} students notified`);
        render();
      },
      'ex-add-q'(el) {
        exam(S.route.slice(5)).qs.push(el.dataset.id);
        render();
      },
      'ex-add-all'() {
        const x = exam(S.route.slice(5));
        S.questions
          .filter((q) => q.status === 'Published' && !x.qs.includes(q.id))
          .forEach((q) => x.qs.push(q.id));

        v.deckGrid = false;
        render();
        window.scrollTo(0, 0);
      },
      'deck-back'() {
        VS().deck = null;
        render();
      },
      'deck-nav'(el) {
        const v = VS();
        v.di += Number(el.dataset.d);
        v.flip = false;
        render();
      },
      'deck-go'(el) {
        const v = VS();
        v.di = Number(el.dataset.i);
        v.deckGrid = false;
        v.flip = false;
        render();
      },
      'deck-flip'() {
        const v = VS();
        v.flip = !v.flip;
        render();
      },
      'deck-grid'() {
        const v = VS();
        v.deckGrid = !v.deckGrid;
        render();
      },
    });

    document.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el) {
        if (
          THEME.groupsClosed &&
          !ev.target.closest('.nav') &&
          Object.values(S.ui.groups).some(Boolean)
        ) {
          S.ui.groups = {};
          render();
        }
        return;
      }
      const fn = A[el.dataset.act];
      if (!fn) return;
      if (
        el.tagName === 'A' &&
        !['new-exam-go', 'batch-students', 'reset-take'].includes(el.dataset.act)
      )
        ev.preventDefault();
      if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'publish') return;
      fn(el);
    });
    document.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const k = ev.target.dataset.actSubmit;
      if (k === 'login') {
        const em = val('l-email');
        if (!/^\S+@\S+\.\S+$/.test(em)) {
          const er = $('#login-error');
          er.hidden = false;
          er.textContent = 'Enter a valid email address.';
          return;
        }
        S.ui.f.lEmail = em;
        S.role = /student/i.test(em) ? 'student' : /teacher/i.test(em) ? 'teacher' : 'admin';
        S.take = null;
        go(S.role === 'student' ? 'home' : 'dashboard');
      }
      if (k === 'signup') {
        const org = val('su-org');
        const err = $('#su-org-err');
        if (!org) {
          err.hidden = false;
          $('#su-org').focus();
          return;
        }
        err.hidden = true;
        const pw = val('su-pass');
        if (!(pw.length >= 8 && /[a-z]/i.test(pw) && /\d/.test(pw))) {
          const h = $('#su-pass-hint');
          h.className = 'hint bad';
          h.textContent = 'Use at least 8 characters with a letter and a number.';
          $('#su-pass').focus();
          return;
        }
        S.ui.f.suOrg = org;
        S.ui.f.suEmail = val('su-email');
        go('pending');
      }
      if (k === 'fsave') A.fsave({ dataset: { mode: 'save' } });
      if (k === 'wiz-next') A['wiz-next']();
      if (k === 'conv-next') A['conv-next']();
      if (k === 'lib-topic') {
        const sid = ev.target.dataset.sid,
          el = document.getElementById('lt-' + sid);
        if (el && el.value.trim()) {
          subj(sid).topics.push({ id: uid('t'), name: el.value.trim() });
          toast('Topic added');
          render();
          const n = document.getElementById('lt-' + sid);
          if (n) n.focus();
        }
      }
      if (k === 'forgot') {
        toast(`If ${val('fp-email') || 'that email'} has an account, a reset link is on its way.`);
        go('login');
      }
    });
    document.addEventListener('input', (ev) => {
      const t = ev.target;
      if (t.dataset.snauto) {
        const c = document.getElementById('sn-code');
        if (c && !c.dataset.touched) c.value = autoCode(t.value);
        return;
      }
      if (t.dataset.scauto) {
        const c = document.getElementById('sc-code');
        if (c && !c.dataset.touched) c.value = autoCode(t.value);
        return;
      }
      if (t.id === 'sn-code' || t.id === 'sc-code') {
        t.dataset.touched = '1';
        return;
      }
      if (t.dataset.fk) {
        const vals = curVals();
        if (vals) {
          const k = t.dataset.fk,
            f = fieldDef(t.dataset.fent, k),
            onExam = S.route.startsWith('exam-');
          if (t.type === 'checkbox') vals[k] = t.checked;
          else if (t.type === 'file') vals[k] = (t.files && t.files[0] && t.files[0].name) || '';
          else vals[k] = f && f.t === 'code' ? t.value.toUpperCase() : t.value;
          if (f && f.t === 'code' && !onExam && S.ui.form) S.ui.form.codeTouched = true;
          if (f && f.auto && !onExam && S.ui.form && !S.ui.form.codeTouched) {
            vals.code = autoCode(t.value);
            const c = document.getElementById('ff-code');
            if (c) c.value = vals.code;
          }
          syncExam(k, vals);
        }
        return;
      }
      if (t.dataset.fopt != null) {
        const v = curVals();
        if (v) v.options[Number(t.dataset.fopt)].t = t.value;
        return;
      }
      if (t.dataset.autocode) {
        const c = document.getElementById('f-code');
        if (c && !c.dataset.touched) c.value = autoCode(t.value);
        codeOk(t.dataset.autocode);
      }
      if (t.id === 'f-code') {
        t.dataset.touched = '1';
        const n = document.getElementById('f-name');
        if (n?.dataset.autocode) codeOk(n.dataset.autocode);
      }
      if (t.dataset.pwcheck) {
        const h = $('#su-pass-hint'),
          ok = t.value.length >= 8 && /[a-z]/i.test(t.value) && /\d/.test(t.value);
        h.className = 'hint' + (t.value ? (ok ? ' ok' : ' bad') : '');
        h.textContent = ok
          ? '✓ Strong enough'
          : 'At least 8 characters, with a letter and a number.';
      }
      if (t.dataset.live) {
        const map = {
          search: (v) => (S.ui.search = v),
          qsearch: (v) => (S.ui.qFilter.q = v),
          stsearch: (v) => (S.ui.stFilter.q = v),
        };
        map[t.dataset.live](t.value);
        const pos = t.selectionStart;
        render();
        const n = document.getElementById(t.id);
        if (n) {
          n.focus();
          n.setSelectionRange(pos, pos);
        }
      }
      if (t.dataset.qe && S.ui.qe && t.tagName !== 'SELECT')
        S.ui.qe[t.dataset.qe] =
          t.dataset.qe === 'marks' || t.dataset.qe === 'neg' ? Number(t.value) : t.value;
      if (t.dataset.qeo != null && S.ui.qe) S.ui.qe.options[Number(t.dataset.qeo)] = t.value;
      if (t.dataset.ex) {
        const x = exam(S.route.slice(5));
        if (x)
          x[t.dataset.ex] = ['duration', 'pass', 'allowed'].includes(t.dataset.ex)
            ? Number(t.value)
            : t.value;
      }
    });
    document.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t.dataset.sheet) {
        const sb = subj(t.dataset.sid);
        if (sb) {
          sb[t.dataset.sheet] =
            t.dataset.sheet === 'code' ? t.value.toUpperCase().trim() : t.value.trim();
          toast('Saved');
        }
        return;
      }
      if (t.dataset.sheetc) {
        const c = course(t.dataset.cid);
        if (c && t.value.trim()) {
          c[t.dataset.sheetc] = t.value.trim();
          toast('Saved');
        }
        return;
      }
      if (t.dataset.fk) {
        if (t.tagName === 'SELECT' || ['checkbox', 'date', 'time', 'file'].includes(t.type)) {
          const v = curVals();
          if (v) {
            const k = t.dataset.fk;
            if (k === 'course') {
              v.subject = '';
              v.topic = '';
              if ('batch' in v) v.batch = '';
              if (Array.isArray(v.batches)) v.batches = [];
              if (Array.isArray(v.subjects)) v.subjects = [];
            }
            if (k === 'subject') {
              v.topic = '';
              if ('parentTopic' in v) v.parentTopic = '';
            }
            if (k === 'type' && v.options) {
              if (v.type === 'True / False')
                v.options = [
                  { t: 'True', c: true },
                  { t: 'False', c: false },
                ];
              else if (v.type === 'Assertion – Reason')
                v.options = [
                  'Both A and R are true, and R explains A',
                  'Both A and R are true, but R does not explain A',
                  'A is true, but R is false',
                  'A is false, but R is true',
                ].map((x, i) => ({ t: x, c: i === 0 }));
              else if (
                v.options.length < 3 ||
                (v.options[0].t === 'True' && v.options.length === 2) ||
                String(v.options[0].t).startsWith('Both A')
              )
                v.options = [
                  { t: '', c: true },
                  { t: '', c: false },
                  { t: '', c: false },
                  { t: '', c: false },
                ];
              else if (v.type === 'Single correct (MCQ)') {
                let seen = false;
                v.options.forEach((o) => {
                  if (o.c && !seen) seen = true;
                  else o.c = false;
                });
                if (!seen) v.options[0].c = true;
              }
            }
            if (S.ui.fe) delete S.ui.fe[k];
            render();
          }
        }
        return;
      }
      if (t.dataset.filter) {
        S.filters[t.dataset.filter] = t.value;
        render();
      }
      if (t.dataset.qf) {
        S.ui.qFilter[t.dataset.qf] = t.value;
        render();
      }
      if (t.dataset.sf) {
        S.ui.stFilter[t.dataset.sf] = t.value;
        render();
      }
      if (t.dataset.board) {
        S.ui.board = t.value;
        render();
      }
      if (t.dataset.org) {
        S.org[t.dataset.org] = t.value;
        render();
        toast('Date & time format updated everywhere');
      }
      if (t.dataset.qe && t.tagName === 'SELECT') {
        if (t.value === '__new') {
          S.ui.qeNew = t.dataset.qe;
          render();
          return;
        }
        S.ui.qe[t.dataset.qe] = t.value;
        if (t.dataset.qe === 'subject') S.ui.qe.topic = '';
        render();
      }
      if (t.id === 'sa-batch' && t.value === '__new') {
        toast('Opening the new batch form');
        S.ui.form = null;
        go('form-batch');
      }
      if (t.dataset.exc) {
        const x = exam(S.route.slice(5));
        x[t.dataset.exc] = t.checked;
      }
      if (t.dataset.exb) {
        const x = exam(S.route.slice(5));
        x.assign.mode = 'batches';
        x.assign.batches = t.checked
          ? x.assign.batches.concat(t.dataset.exb)
          : x.assign.batches.filter((b) => b !== t.dataset.exb);
        render();
      }
      if (t.dataset.ex && (t.dataset.ex === 'opens' || t.dataset.ex === 'closes')) render();
    });
    document.addEventListener('keydown', (ev) => {
      const t = ev.target;
      if (
        ev.key === 'Escape' &&
        S.ui.v &&
        (S.ui.v.panel || S.ui.v.drawer || S.ui.v.sheetNew || S.ui.v.sheetCourse)
      ) {
        Object.assign(S.ui.v, { panel: null, drawer: null, sheetNew: null, sheetCourse: false });
        S.ui.form = null;
        S.ui.fe = {};
        render();
        return;
      }
      if (ev.key === 'Escape' && (S.ui.add || S.ui.renaming || S.ui.newExam)) {
        if (S.ui.add) {
          S.ui.form = null;
          S.ui.fe = {};
        }
        S.ui.add = null;
        S.ui.renaming = null;
        S.ui.newExam = false;
        render();
        return;
      }
      if (ev.key === 'Enter' && t.dataset.enter) {
        ev.preventDefault();
        if (t.dataset.enter === 'sheet') {
          A['sheet-save']();
          return;
        }
        if (t.dataset.enter === 'sheetc') {
          A['sheet-course-save']();
          return;
        }
        if (t.dataset.enter === 'rename') {
          const n = findNode(t.dataset.id);
          if (t.value.trim()) n.node.name = t.value.trim();
          S.ui.renaming = null;
          render();
          toast('Renamed');
          return;
        }
        const form = t.closest('.inline-form, .topics');
        const btn = form && form.querySelector('[data-act^="save"], [data-act="qe-new-save"]');
        if (btn) btn.click();
      }
    });

    route();
  })();
</script>
