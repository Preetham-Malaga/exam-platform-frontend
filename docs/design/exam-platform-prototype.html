<title>Exam Platform Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
/>
<style>
  /* Layout: floating white sidebar card + fluid bento grid on a lavender-grey ground (client-approved Pastel Bento). */
  /*TOKENS-START*/
  :root {
    --bg: #f3f1f9;
    --surface: #ffffff;
    --surface-2: #faf9fd;
    --row: #f8f7fc;
    --ink: #221d3a;
    --muted: #6b6487;
    --border: #e2def0;
    --accent: #5b3fd6;
    --focus: #7c63f5;
    --primary: #221d3a;
    --on-primary: #ffffff;
    --hero: #221d3a;
    --on-hero: #ffffff;
    --hero-muted: #c9c2ea;
    --lav: #e5deff;
    --lav-ink: #3e2a9e;
    --mint: #d6f3e4;
    --mint-ink: #1c6b45;
    --peach: #ffe3d3;
    --peach-ink: #8a3b12;
    --sky: #d7e8ff;
    --sky-ink: #1e4d8f;
    --butter: #fff3c4;
    --butter-ink: #6e5600;
    --pink: #fdddeb;
    --pink-ink: #8c1d40;
    --danger-bg: #ffe0e3;
    --danger: #a1192b;
    --dash: #c9c0f0;
    --bar: #e5deff;
    --bar-peak: #7c63f5;
    --proto: #221d3a;
    --on-proto: #ffffff;
    --font:
      'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --display: var(--font);
    --r-card: 28px;
    --r-tile: 24px;
    --r-row: 18px;
    --r-input: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #141220;
      --surface: #1d1a2a;
      --surface-2: #252238;
      --row: #232035;
      --ink: #eeeafb;
      --muted: #a9a3c4;
      --border: #352f4c;
      --accent: #b7a8ff;
      --focus: #9c88ff;
      --primary: #cfc2ff;
      --on-primary: #17132a;
      --hero: #2b2450;
      --on-hero: #ffffff;
      --hero-muted: #c9c2ea;
      --lav: #2e2758;
      --lav-ink: #d9d0ff;
      --mint: #16382a;
      --mint-ink: #9ee6bf;
      --peach: #3d261a;
      --peach-ink: #ffc9a8;
      --sky: #18304f;
      --sky-ink: #b5d3ff;
      --butter: #3a3214;
      --butter-ink: #f5de88;
      --pink: #3e1e2d;
      --pink-ink: #ffb7d2;
      --danger-bg: #3e1c22;
      --danger: #ff9aa6;
      --dash: #4a4270;
      --bar: #3a3266;
      --bar-peak: #9c88ff;
      --proto: #0c0a14;
      --on-proto: #eeeafb;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #141220;
    --surface: #1d1a2a;
    --surface-2: #252238;
    --row: #232035;
    --ink: #eeeafb;
    --muted: #a9a3c4;
    --border: #352f4c;
    --accent: #b7a8ff;
    --focus: #9c88ff;
    --primary: #cfc2ff;
    --on-primary: #17132a;
    --hero: #2b2450;
    --on-hero: #ffffff;
    --hero-muted: #c9c2ea;
    --lav: #2e2758;
    --lav-ink: #d9d0ff;
    --mint: #16382a;
    --mint-ink: #9ee6bf;
    --peach: #3d261a;
    --peach-ink: #ffc9a8;
    --sky: #18304f;
    --sky-ink: #b5d3ff;
    --butter: #3a3214;
    --butter-ink: #f5de88;
    --pink: #3e1e2d;
    --pink-ink: #ffb7d2;
    --danger-bg: #3e1c22;
    --danger: #ff9aa6;
    --dash: #4a4270;
    --bar: #3a3266;
    --bar-peak: #9c88ff;
    --proto: #0c0a14;
    --on-proto: #eeeafb;
    color-scheme: dark;
  }
  /*TOKENS-END*/
  /* Brand presets (Settings › Branding) */
  :root[data-brand='ocean'] {
    --accent: #0b6b8a;
    --focus: #1592b8;
    --lav: #d3eef6;
    --lav-ink: #0b4f66;
    --bar: #d3eef6;
    --bar-peak: #1592b8;
    --hero: #0b3b4f;
    --primary: #0b3b4f;
  }
  :root[data-brand='forest'] {
    --accent: #2d7a4f;
    --focus: #3e9a66;
    --lav: #d9efd9;
    --lav-ink: #1e5a36;
    --bar: #d9efd9;
    --bar-peak: #3e9a66;
    --hero: #173b28;
    --primary: #173b28;
  }
  :root[data-brand='sunset'] {
    --accent: #b5471b;
    --focus: #d9622f;
    --lav: #ffe1d1;
    --lav-ink: #8a3b12;
    --bar: #ffe1d1;
    --bar-peak: #d9622f;
    --hero: #4a1e10;
    --primary: #4a1e10;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-brand='ocean']:not([data-theme='light']) {
      --accent: #7fd3ee;
      --focus: #4fb8da;
      --lav: #123845;
      --lav-ink: #bceaf8;
      --bar: #173f4e;
      --bar-peak: #4fb8da;
      --hero: #0f3442;
      --primary: #9fddf0;
    }
    :root[data-brand='forest']:not([data-theme='light']) {
      --accent: #8fdcae;
      --focus: #5fc48a;
      --lav: #163a26;
      --lav-ink: #c2f0d3;
      --bar: #1b432c;
      --bar-peak: #5fc48a;
      --hero: #163a26;
      --primary: #a8e6c0;
    }
    :root[data-brand='sunset']:not([data-theme='light']) {
      --accent: #ffb08a;
      --focus: #f08a5d;
      --lav: #40231a;
      --lav-ink: #ffd3bd;
      --bar: #4a2a1e;
      --bar-peak: #f08a5d;
      --hero: #40231a;
      --primary: #ffc4a6;
    }
  }
  :root[data-brand='ocean'][data-theme='dark'] {
    --accent: #7fd3ee;
    --focus: #4fb8da;
    --lav: #123845;
    --lav-ink: #bceaf8;
    --bar: #173f4e;
    --bar-peak: #4fb8da;
    --hero: #0f3442;
    --primary: #9fddf0;
  }
  :root[data-brand='forest'][data-theme='dark'] {
    --accent: #8fdcae;
    --focus: #5fc48a;
    --lav: #163a26;
    --lav-ink: #c2f0d3;
    --bar: #1b432c;
    --bar-peak: #5fc48a;
    --hero: #163a26;
    --primary: #a8e6c0;
  }
  :root[data-brand='sunset'][data-theme='dark'] {
    --accent: #ffb08a;
    --focus: #f08a5d;
    --lav: #40231a;
    --lav-ink: #ffd3bd;
    --bar: #4a2a1e;
    --bar-peak: #f08a5d;
    --hero: #40231a;
    --primary: #ffc4a6;
  }

  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.45;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    text-wrap: balance;
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }

  /* prototype bar */
  .proto {
    background: var(--proto);
    color: var(--on-proto);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 12px;
  }
  .proto strong {
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .proto .seg {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .proto button {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: var(--on-proto);
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
  }
  .proto button[aria-pressed='true'] {
    background: var(--on-proto);
    color: var(--proto);
  }
  .proto .clock {
    margin-left: auto;
    opacity: 0.85;
  }

  /* shell */
  .shell {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    padding-block: 20px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .side {
    flex: 1 1 236px;
    max-width: 280px;
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: var(--lav);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .brand b {
    display: block;
    font-size: 16px;
    font-weight: 800;
  }
  .brand span {
    font-size: 12px;
    color: var(--muted);
  }
  .menu-btn {
    display: none;
  }
  nav.nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .nav a,
  .nav .grp-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 12px;
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    min-height: 40px;
    width: 100%;
    background: none;
    border: 0;
    cursor: pointer;
    text-align: left;
  }
  .nav a:hover,
  .nav .grp-btn:hover {
    background: var(--bg);
    text-decoration: none;
  }
  .nav a[aria-current='page'] {
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 700;
  }
  .nav .grp-btn {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    justify-content: space-between;
    min-height: 34px;
    margin-top: 6px;
  }
  .nav .grp-items {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-left: 8px;
  }
  .nav svg {
    flex-shrink: 0;
  }
  .side-foot {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 12px 8px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .main {
    flex: 999 1 560px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (max-width: 860px) {
    .side {
      max-width: none;
      padding: 12px;
    }
    .menu-btn {
      display: inline-flex;
      margin-left: auto;
    }
    .side .brand {
      padding: 0 4px;
    }
    .side:not(.open) nav.nav,
    .side:not(.open) .side-foot {
      display: none;
    }
  }

  /* page header */
  .ph {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 14px;
  }
  .ph .crumb {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .ph h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .ph p {
    margin: 4px 0 0;
    color: var(--muted);
    max-width: 62ch;
  }
  .ph-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .user-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border-radius: 999px;
    padding: 4px 14px 4px 4px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--peach);
    color: var(--peach-ink);
    display: grid;
    place-items: center;
    font-weight: 800;
    flex-shrink: 0;
  }
  .user-pill small {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }

  /* buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--on-primary);
  }
  .btn-secondary {
    background: var(--lav);
    color: var(--lav-ink);
  }
  .btn-ghost {
    background: var(--bg);
    color: var(--ink);
  }
  .btn-danger {
    background: var(--danger);
    color: var(--surface);
  }
  .btn-sm {
    min-height: 36px;
    padding: 0 14px;
    font-size: 13px;
  }
  .btn[disabled],
  .btn[aria-disabled='true'] {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 0;
    background: transparent;
    color: var(--muted);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
  }
  .icon-btn:hover {
    background: var(--bg);
    color: var(--ink);
  }

  /* cards + tiles */
  .card {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  .card-h {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .card-h h2 {
    font-size: 18px;
    font-weight: 800;
  }
  .card-h .sub {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .grid {
    display: grid;
    gap: 16px;
  }
  .g4 {
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  }
  .g3 {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .row2 {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .row2 > * {
    min-width: 0;
  }
  .tile {
    border-radius: var(--r-tile);
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    min-height: 132px;
  }
  .tile .lbl {
    font-weight: 700;
  }
  .tile .val {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .tile .chip {
    align-self: flex-start;
    background: var(--surface);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  .t-lav {
    background: var(--lav);
    color: var(--ink);
  }
  .t-lav .lbl,
  .t-lav .chip {
    color: var(--lav-ink);
  }
  .t-mint {
    background: var(--mint);
  }
  .t-mint .lbl,
  .t-mint .chip {
    color: var(--mint-ink);
  }
  .t-peach {
    background: var(--peach);
  }
  .t-peach .lbl,
  .t-peach .chip {
    color: var(--peach-ink);
  }
  .t-sky {
    background: var(--sky);
  }
  .t-sky .lbl,
  .t-sky .chip {
    color: var(--sky-ink);
  }
  .t-butter {
    background: var(--butter);
  }
  .t-butter .lbl,
  .t-butter .chip {
    color: var(--butter-ink);
  }
  .t-pink {
    background: var(--pink);
  }
  .t-pink .lbl,
  .t-pink .chip {
    color: var(--pink-ink);
  }
  .t-hero {
    background: var(--hero);
    color: var(--on-hero);
  }
  .t-hero .lbl {
    color: var(--hero-muted);
  }

  /* pills / badges */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .b-ok {
    background: var(--mint);
    color: var(--mint-ink);
  }
  .b-bad {
    background: var(--danger-bg);
    color: var(--danger);
  }
  .b-neutral {
    background: var(--bg);
    color: var(--ink);
  }
  .b-lav {
    background: var(--lav);
    color: var(--lav-ink);
  }
  .b-warn {
    background: var(--butter);
    color: var(--butter-ink);
  }
  .b-sky {
    background: var(--sky);
    color: var(--sky-ink);
  }
  .b-dark {
    background: var(--primary);
    color: var(--on-primary);
  }
  .code {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    background: var(--surface);
    border-radius: 8px;
    padding: 3px 8px;
    color: var(--ink);
  }
  .code.on-row {
    background: var(--bg);
  }

  /* form */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .field label,
  .lbl-sm {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .input,
  select.input,
  textarea.input {
    height: 46px;
    border: 1.5px solid var(--border);
    border-radius: var(--r-input);
    background: var(--surface-2);
    padding: 0 14px;
    width: 100%;
    min-width: 0;
  }
  textarea.input {
    height: auto;
    min-height: 96px;
    padding: 12px 14px;
    resize: vertical;
  }
  .input:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .input.code-in {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 800;
  }
  .hint {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .hint.ok {
    color: var(--mint-ink);
  }
  .hint.bad {
    color: var(--danger);
  }
  .form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .form-row > .field {
    flex: 1 1 180px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 36px;
    cursor: pointer;
  }
  .check input {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
  }

  /* inline add */
  .add-tile {
    border: 2px dashed var(--dash);
    background: var(--surface-2);
    color: var(--accent);
    border-radius: var(--r-tile);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
  }
  .add-tile .plus {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: var(--lav);
    display: grid;
    place-items: center;
    font-size: 22px;
    color: var(--lav-ink);
  }
  .add-row {
    border: 2px dashed var(--dash);
    background: var(--surface-2);
    color: var(--accent);
    border-radius: var(--r-row);
    min-height: 46px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
  }
  .inline-form {
    background: var(--surface);
    border: 2px solid var(--focus);
    border-radius: var(--r-tile);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 12px 30px color-mix(in srgb, var(--focus) 16%, transparent);
  }
  .inline-form .if-h {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    font-weight: 800;
  }
  .inline-form .if-f {

    /* ---------- syllabus ---------- */
    function vSyllabus() {
      const q = S.ui.search.trim().toLowerCase();

      const courses = S.courses.filter(
        (c) =>
          match(c.name) ||

        `<div class="confirm-row" data-testid="syllabus-delete-confirm" data-entity-id="${id}"><span>${blocked ? `${e(label)} has ${blocked} questions. Move them before deleting.` : `Delete ${e(label)}?`}</span><span style="display:flex;gap:8px">${blocked ? '' : `<button type="button" class="btn btn-danger btn-sm" data-act="del-node" data-id="${id}" data-testid="syllabus-delete-confirm-btn">Delete</button>`}<button type="button" class="btn btn-ghost btn-sm" data-act="cancel-confirm" data-testid="syllabus-delete-cancel-btn">${blocked ? 'OK' : 'Cancel'}</button></span></div>`;

        .map((c) => {
          const open = c.open || !!q;
          const qn = c.subjects.reduce((s, x) => s + qCountSubj(x.id), 0);

      <button type="button" class="icon-btn" data-act="rename" data-id="${c.id}" aria-label="Rename ${e(c.name)}" data-testid="syllabus-course-rename-btn">${ic('edit', 16)}</button><button type="button" class="icon-btn" data-act="ask-del" data-id="${c.id}" aria-label="Delete ${e(c.name)}" data-testid="syllabus-course-delete-btn">${ic('trash', 16)}</button></div>`;
          if (open) {
            h += `<div class="kids">${c.subjects
              .filter((s) => match(s.name) || s.topics.some((t) => match(t.name)) || match(c.name))

                const so = s.open || !!q;
                const qs = qCountSubj(s.id);
                let sh =
                  S.ui.confirm === s.id
                    ? confirmRow(s.id, s.name, qs)
                    : `<div class="node" data-testid="syllabus-subject-row" data-entity-id="${s.id}" data-entity-code="${s.code}" data-expanded="${so}">
          <button type="button" class="icon-btn" data-act="toggle" data-id="${s.id}" aria-label="${so ? 'Collapse' : 'Expand'} ${e(s.name)}" data-testid="syllabus-subject-toggle-btn"><span class="chev${so ? ' open' : ''}">${ic('chev')}</span></button>
          <span class="code on-row">${e(s.code)}</span><span class="grow">${nodeName(s.id, s.name)}</span><span class="meta">${s.topics.length} topics · ${qs} questions</span>
          <button type="button" class="icon-btn" data-act="rename" data-id="${s.id}" aria-label="Rename ${e(s.name)}" data-testid="syllabus-subject-rename-btn">${ic('edit', 16)}</button><button type="button" class="icon-btn" data-act="ask-del" data-id="${s.id}" aria-label="Delete ${e(s.name)}" data-testid="syllabus-subject-delete-btn">${ic('trash', 16)}</button></div>`;

                  sh += `<div class="topics" data-testid="syllabus-topic-list">${s.topics.map((t) => `<span class="topic" data-testid="syllabus-topic-chip" data-entity-id="${t.id}">${e(t.name)}<button type="button" class="icon-btn" style="width:28px;height:28px" data-act="del-topic" data-id="${t.id}" data-s="${s.id}" aria-label="Delete topic ${e(t.name)}" data-testid="syllabus-topic-delete-btn">✕</button></span>`).join('')}
          ${
            a.kind === 'topic' && a.parent === s.id
              ? ''

                ? `<span style="display:flex;gap:6px;align-items:center"><label for="f-name" class="lbl-sm" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">New topic in ${e(s.name)}</label><input class="input" id="f-name" data-enter="1" placeholder="e.g. Synchronous Motors" data-testid="syllabus-topic-name-input" style="height:38px;width:220px"><button type="button" class="btn btn-primary btn-sm" data-act="save-topic" data-id="${s.id}" data-testid="syllabus-topic-save-btn">Add</button><button type="button" class="btn btn-ghost btn-sm" data-act="close-add" data-testid="syllabus-topic-done-btn">Done</button><a class="btn btn-ghost btn-sm" href="#form-topic-${s.id}" data-testid="syllabus-topic-all-details-link">All details</a></span>`
                : `<a class="topic" style="border-style:dashed;color:var(--accent);cursor:pointer;padding:6px 12px;text-decoration:none" href="#form-topic-${s.id}" data-testid="syllabus-add-topic-btn">+ Add topic</a>`

                if (so && a.kind === 'topic' && a.parent === s.id)

      ${
        a.kind === 'subject' && a.parent === c.id

  <section class="card" data-testid="syllabus-card"><div class="filters"><div class="field search"><label for="syl-search">Search ${e(syl)}</label><input class="input" id="syl-search" type="search" value="${e(S.ui.search)}" placeholder="Search courses, subjects or topics" data-live="search" data-testid="syllabus-search-input"></div>

    /* ---------- question bank ---------- */
    function vQuestions() {
      const f = S.ui.qFilter;

        (q) =>
          (f.subject === 'all' || q.subject === f.subject) &&
          (f.diff === 'all' || q.diff === f.diff) &&
          (f.status === 'all' || q.status === f.status) &&
          (!f.q || q.text.toLowerCase().includes(f.q.toLowerCase())),

          : `<tr data-testid="questions-row" data-entity-id="${q.id}" data-state="${q.status.toLowerCase()}"><td style="max-width:380px"><b>${e(q.text)}</b><span class="sub">${e(q.type)} · ${q.options.length} options</span></td><td>${e(subj(q.subject)?.name)}<span class="sub">${e(topicName(q.topic))}</span></td>

      )

    `<tr><td colspan="6"><div class="empty" data-testid="questions-empty"><b>No questions match these filters</b>Clear a filter or add a question.</div></td></tr>`
  }
  </tbody></table></div><span class="hint">Showing ${list.length} of ${S.questions.length}</span></section>`;
    }
    function vQuestionEdit(id) {
      const q0 = id === 'new' ? null : S.questions.find((q) => q.id === id);
      if (!S.ui.qe || S.ui.qe.src !== id)
        S.ui.qe = q0
          ? JSON.parse(JSON.stringify(q0))
          : {
              id: 'new',
              text: '',
              subject: S.ui.qFilter.subject !== 'all' ? S.ui.qFilter.subject : 's1',
              topic: '',
              type: 'Multiple choice',
              diff: 'Medium',
              status: 'Draft',
              marks: 4,
              neg: 1,
              options: ['', '', '', ''],
              correct: 0,
            };
      S.ui.qe.src = id;
      const d = S.ui.qe;
      const s = subj(d.subject);
      return `${ph(`<a href="#questions">Question Bank</a> › ${q0 ? 'Edit question' : 'New question'}`, q0 ? 'Edit question' : 'New question', 'Mark the correct option by clicking its letter. Saving keeps you on this page so you can add the next one.')}

    <div class="form-row">${inp('qe-marks', 'Marks', d.marks, 'question-editor-marks-input', 'data-qe="marks" inputmode="decimal"')}${inp('qe-neg', 'Negative marks', d.neg, 'question-editor-negative-marks-input', 'data-qe="neg" inputmode="decimal"')}</div>

    /* ---------- exams ---------- */

      if (f.t === 'url') r.push('Starts with https://');

      if (f.match) r.push(`Must match ${label(ent, f.match)}`);
      if (f.t === 'code')
        r.push(
          `2–10 characters A–Z, 0–9 or -, saved uppercase${f.pool ? ', unique in the organization' : ''}`,

      if (f.auto) r.push('Suggests the code as you type');

        if (f.min != null) r.push('Min ' + f.min);
        if (f.max != null) r.push('Max ' + f.max);
        if (f.lte) r.push('≤ ' + label(ent, f.lte));
      } else if (f.max) r.push(`Max ${f.max} characters`);
      if (f.pattern === 'pin') r.push('6 digits');
      if (f.pattern === 'gstin') r.push('15-character GSTIN format');
      if (f.after) r.push(`On or after ${label(ent, f.after)}`);
      if (f.future) r.push('Today or later');
      if (f.past) r.push('A past date');
      if (f.accept) r.push('Accepts ' + f.accept);
      if (f.when) r.push('Shown only when ' + f.when);
      if (f.fixed) r.push('Locked on');

      if (f.t === 'options')
        r.push(

      if (f.d != null && f.d !== '' && !(Array.isArray(f.d) && !f.d.length))
        r.push(
          'Default: ' +
            (Array.isArray(f.d)
              ? f.d.join(', ')
              : f.d === true
                ? 'on'
                : f.o && typeof f.o !== 'function'
                  ? (f.o.find((o) => o[0] === f.d) || [0, f.d])[1]
                  : f.d),

        r.push(

              : ['select', 'radio', 'multi'].includes(f.t)

          errs[f.k] = 'Enter a valid email, like name@institution.org.';
        if (f.t === 'tel' && !/^(\+?91)?[6-9]\d{9}$/.test(s.replace(/[\s-]/g, '')))
          errs[f.k] = 'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';
        if (f.t === 'url' && !/^https?:\/\/\S+\.\S+/.test(s))

        if (f.t === 'password' && !f.match && !(s.length >= 8 && /[a-z]/i.test(s) && /\d/.test(s)))

        if (f.t === 'number') {

          else if (f.lte && v[f.lte] !== '' && n > Number(v[f.lte]))
            errs[f.k] = `Can't be more than ${label(ent, f.lte).toLowerCase()}.`;

    function ownerData() {

      const notInv = rows.filter((s) => s.login === 'Not invited').length,
        invited = rows.filter((s) => s.login === 'Invited').length,
        noBatch = f.batch === 'all' ? S.students.filter((s) => !s.batch).length : 0;

        (r) =>

          (f.course === 'all' || exam(r.exam)?.course === f.course),
      );
      const passN = res.filter((r) => r.score >= exam(r.exam).pass).length;

        .filter(
          (x) =>
            (f.exam === 'all' || x.id === f.exam) && (f.course === 'all' || x.course === f.course),
        )
        .reduce((a, x) => a + x.attempts, 0);

        ),

          [

      const mx = Math.max(...d.days, 1);
      const examRows = S.exams
        .filter((x) => d.f.exam === 'all' || x.id === d.f.exam)
        .map((x) => {
          const rs = S.results.filter((r) => r.exam === x.id),

          return `<tr data-testid="dashboard-exam-row" data-entity-id="${x.id}" data-state="${examState(x)}"><td><a href="#exam-${x.id}"><b>${e(x.name)}</b></a><span class="sub">${e(course(x.course)?.name)} · ${x.qs.length} questions</span></td><td>${statusBadge(examState(x))}</td><td class="num">${x.opens ? fmtDate(x.opens) + ' → ' + fmtDate(x.closes) : '<span class="hint">Not set</span>'}</td><td class="num">${reach(x)}</td><td class="num">${x.attempts}</td><td class="num">${a}</td></tr>`;

      const top = S.results
          .slice()
          .sort((a, b) => b.score - a.score || a.time - b.time)

        low = S.results.filter((r) => r.score < exam(r.exam).pass);
      return `${dashHead()}${dashFilters()}
  <section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))" data-testid="dashboard-headline">
    <div class="tile t-lav" style="min-height:0" data-testid="dashboard-tile-students"><span class="lbl">Students</span><span class="val num" data-testid="dashboard-tile-students-value">${d.students}</span><span class="chip">${d.batches.length} batches</span></div>
    <div class="tile t-sky" style="min-height:0" data-testid="dashboard-tile-exams-open"><span class="lbl">Exams open now</span><span class="val num" data-testid="dashboard-tile-exams-open-value">${d.open.length}</span><span class="chip">${d.drafts.length} in draft</span></div>
    <div class="tile t-hero" style="min-height:0" data-testid="dashboard-tile-results"><span class="lbl">Results · ${d.rl}</span><span class="val num" data-testid="dashboard-tile-results-value">${d.days.reduce((a, b) => a + b, 0)}</span><span class="hint" style="color:var(--hero-muted)">${d.attempts} attempts in total</span></div>
    <div class="tile t-butter" style="min-height:0" data-testid="dashboard-tile-avg-score"><span class="lbl">Average score</span><span class="val num" data-testid="dashboard-tile-avg-score-value">${d.avg == null ? '—' : d.avg + '%'}</span><span class="chip">across ${d.res.length} results</span></div>

    <div class="tile t-pink" style="min-height:0" data-testid="dashboard-tile-live-today"><span class="lbl">Live classes today</span><span class="val num" data-testid="dashboard-tile-live-today-value">${d.liveToday.length}</span><span class="chip">${d.liveToday.filter((l) => liveState(l) === 'live').length} live now</span></div></section>
  <section class="card" data-testid="dashboard-flow"><div class="card-h"><h2>From course to result</h2><span class="sub">Each step of your flow — click one to open it</span></div><div class="flow">${flow}</div></section>
  <section class="row2">
    <div class="card" style="flex:2 1 460px" data-testid="dashboard-results-chart"><div class="card-h"><h2>Exams submitted per day</h2><span class="pill b-neutral">${d.rl}</span></div>
      <div class="bars" role="img" aria-label="Exams submitted per day, peak ${mx}">${d.days.map((v, i) => `<div class="b"><span class="num">${v}</span><i style="height:${Math.max(4, (v / mx) * 86)}%;background:${v === mx ? 'var(--bar-peak)' : i === d.days.length - 1 ? 'var(--primary)' : 'var(--bar)'}"></i></div>`).join('')}</div>
      <div class="axis"><span>${fmtDate(d.f.range === 'today' ? '2026-10-28' : d.f.range === '7' ? '2026-10-22' : '2026-10-15')}</span><span>${fmtDate('2026-10-28')}</span></div></div>
    <div class="card" style="flex:1 1 300px" data-testid="dashboard-attention"><div class="card-h"><h2>Needs your attention</h2></div>${attentionRows({ drafts: d.drafts, notInvited: d.notInv, noBatch: d.noBatch })}${low.length ? `<div class="list-row" data-testid="dashboard-attention-row"><span class="sq" style="background:var(--danger-bg);color:var(--danger)">${ic('chart', 16)}</span><span class="grow">${low.length} ${low.length === 1 ? 'student' : 'students'} scored below the pass mark. <a href="#results">See who</a></span></div>` : ''}</div></section>
  <section class="row2">
    <div class="card" style="flex:2 1 520px" data-testid="dashboard-exams"><div class="card-h"><h2>Exams</h2><a href="#exams" data-testid="dashboard-all-exams-link">All exams</a></div><div class="tbl-wrap"><table class="tbl" style="min-width:620px"><thead><tr><th>Exam</th><th>Status</th><th>Window</th><th>Students</th><th>Attempts</th><th>Avg</th></tr></thead><tbody>${examRows}</tbody></table></div></div>
    <div class="card" style="flex:1 1 300px" data-testid="dashboard-today"><div class="card-h"><h2>Today</h2><span class="sub">${fmtDate('2026-10-28')}</span></div>
      ${d.liveToday.map((l) => `<div class="list-row" data-testid="dashboard-today-row" data-entity-id="${l.id}"><span class="num" style="font-weight:800;min-width:64px">${fmtTime(l.time)}</span><span class="grow"><b>${e(l.title)}</b><span class="sub">${e(batch(l.batch)?.name)} · ${e(l.teacher)}</span></span>${liveState(l) === 'live' ? '<span class="pill b-bad">● Live</span>' : liveState(l) === 'past' ? '<span class="pill b-neutral">Done</span>' : ''}</div>`).join('')}
      ${S.exams
        .filter((x) => x.opens === '2026-10-29')
        .map(
          (x) =>
            `<div class="list-row" data-testid="dashboard-today-row" data-entity-id="${x.id}"><span class="num" style="font-weight:800;min-width:64px">Tomorrow</span><span class="grow"><b>${e(x.name)} opens</b><span class="sub">${reach(x)} students · ${x.duration} min</span></span></div>`,
        )
        .join('')}
      ${open_close_line(d)}</div></section>
  <section class="row2">
    <div class="card" style="flex:1 1 300px" data-testid="dashboard-learning"><div class="card-h"><h2>Learning</h2></div>
      <a href="#live" class="list-row" style="text-decoration:none;color:var(--ink)" data-testid="dashboard-learning-live"><span class="sq" style="background:var(--pink);color:var(--pink-ink)">${ic('video', 16)}</span><span class="grow"><b>${d.liveWeek.length} live classes this week</b><span class="sub">${S.live.filter((l) => liveState(l) === 'past' && !l.rec).length} without a recording</span></span></a>
      <a href="#recorded" class="list-row" style="text-decoration:none;color:var(--ink)" data-testid="dashboard-learning-recorded"><span class="sq" style="background:var(--sky);color:var(--sky-ink)">${ic('play', 16)}</span><span class="grow"><b>${S.recorded.length} recorded classes</b><span class="sub">${S.recorded.reduce((a, r) => a + r.views, 0)} views</span></span></a>
      <a href="#materials" class="list-row" style="text-decoration:none;color:var(--ink)" data-testid="dashboard-learning-materials"><span class="sq" style="background:var(--butter);color:var(--butter-ink)">${ic('folder', 16)}</span><span class="grow"><b>${S.materials.length} materials shared</b><span class="sub">${S.materials.filter((m) => m.date >= '2026-10-22').length} added this week</span></span></a></div>
    <div class="card" style="flex:1 1 300px" data-testid="dashboard-teachers"><div class="card-h"><h2>Teachers</h2><a href="#teachers" data-testid="dashboard-all-teachers-link">All</a></div>
      ${S.teachers
        .map(
          (t) =>
            `<div class="list-row" data-testid="dashboard-teacher-row" data-entity-id="${t.id}"><span class="sq" style="background:var(--mint);color:var(--mint-ink)">${e(
              t.name
                .split(' ')
                .map((w) => w[0])
                .join(''),
            )}</span><span class="grow"><b>${e(t.name)}</b><span class="sub">${e(t.subjects)}</span></span>${loginBadge(t.login)}</div>`,
        )
        .join('')}</div>
    <div class="card" style="flex:1 1 300px" data-testid="dashboard-top"><div class="card-h"><h2>Top students</h2><a href="#leaderboard" data-testid="dashboard-leaderboard-link">Leaderboard</a></div>
      ${top.map((r, i) => `<div class="list-row" data-testid="dashboard-top-row" data-entity-id="${e(r.roll)}"><span class="sq" style="background:var(--${['butter', 'lav', 'peach'][i]});color:var(--${['butter', 'lav', 'peach'][i]}-ink)">${i + 1}</span><span class="grow"><b>${e(r.st)}</b><span class="sub">${e(exam(r.exam).name)}</span></span><b class="num">${r.score}%</b></div>`).join('')}</div></section>
  <section class="card" data-testid="dashboard-recent-results"><div class="card-h"><h2>Latest results</h2><a href="#results" data-testid="dashboard-all-results-link">All results</a></div>${d.res.slice(0, 5).map(resultRow).join('') || '<div class="empty"><b>No results for these filters</b></div>'}</section>`;
    }
    function open_close_line(d) {
      const c = d.open
        .filter((x) => x.closes && x.closes >= '2026-10-28')
        .sort((a, b) => a.closes.localeCompare(b.closes))[0];
      return c
        ? `<div class="list-row" data-testid="dashboard-today-row" data-entity-id="${c.id}"><span class="num" style="font-weight:800;min-width:64px">${fmtDate(c.closes).slice(0, 5)}</span><span class="grow"><b>${e(c.name)} closes</b><span class="sub">${c.attempts} of ${reach(c)} students have attempted</span></span><span class="pill b-warn">${reach(c) - c.attempts} left</span></div>`
        : '';

    function vDashboard() {
      return (
        {
          owner: vDashOwner,
          bento: vDashBento,
          command: vDashCommand,
          editorial: vDashEditorial,
          focus: vDashFocus,
          swiss: vDashSwiss,
          arena: vDashArena,
        }[THEME.dash] || vDashBento
      )();
    }
    function dashCalc() {
      const f = S.filters,
        RF = { today: 0.05, 7: 0.27, 30: 1, month: 0.93 };
      const k =
        RF[f.range] *
        (f.batch === 'all' ? 1 : 0.32) *
        (f.course === 'all' ? 1 : f.course === 'c1' ? 0.7 : 0.15) *
        (f.exam === 'all' ? 1 : 0.4);
      const rl = { today: 'Today', 7: 'Last 7 days', 30: 'Last 30 days', month: 'This month' }[
        f.range
      ];
      const base = [118, 142, 96, 158, 181, 129, 88, 173, 207, 192, 166, 219, 238, 187];
      const days = f.range === 'today' ? base.slice(-1) : f.range === '7' ? base.slice(-7) : base;
      const vals = days.map((v) => Math.max(0, Math.round((v * k) / RF[f.range])));
      const res = Math.round(2417 * k);
      return {
        f,
        rl,
        vals,
        mx: Math.max(...vals, 1),
        res,
        avg: res ? (72.4 - (f.batch !== 'all' ? 3.1 : 0)).toFixed(1) + '%' : '—',
        pass: res ? (f.batch !== 'all' ? 78 : 81) : null,
        students: f.batch === 'all' ? 1232 + S.students.length : batchCount(f.batch),
        teachers: S.role === 'teacher' ? 1 : 64,
        questions: 3804 + S.questions.length,
        qPub: 2934 + S.questions.filter((q) => q.status === 'Published').length,
        exams: 121 + S.exams.length,
        ePub: 95 + S.exams.filter((x) => x.status === 'published').length,
        most: S.exams.filter((x) => x.attempts > 0).sort((a, b) => b.attempts - a.attempts),
        startIso:
          f.range === 'today' ? '2026-10-28' : f.range === '7' ? '2026-10-22' : '2026-10-15',
        today: S.live.filter((l) => l.date === '2026-10-28'),
        drafts: S.exams.filter((x) => x.status === 'draft'),
        notInvited: S.students.filter((s) => s.login === 'Not invited').length,
        noBatch: S.students.filter((s) => !s.batch).length,
      };
    }
    function dashHead() {
      const isT = S.role === 'teacher';
      return ph(
        'Overview',
        `Hi, ${e(S.user[S.role].name.split(' ')[0])}`,
        `Your ${isT ? 'batches' : 'organization'} at a glance · ${fmtDate('2026-10-28')}`,
        `<button type="button" class="btn btn-ghost" data-act="pdf" data-name="Dashboard" data-testid="dashboard-download-pdf-btn">${ic('dl')}Download PDF</button><a class="btn btn-primary" href="#form-exam" data-testid="dashboard-create-exam-btn">${ic('plus')}Create exam</a>`,
      );
    }
    function dashFilters() {
      const f = S.filters,
        active = f.range !== '30' || f.batch !== 'all' || f.course !== 'all' || f.exam !== 'all';
      return `<section class="card" style="padding:16px 18px" data-testid="dashboard-filters" aria-label="Dashboard filters"><div class="filters">
    ${sel(
      'df-range',
      'Date range',
      [
        ['today', 'Today'],
        ['7', 'Last 7 days'],
        ['30', 'Last 30 days'],
        ['month', 'This month'],
      ],
      f.range,
      'dashboard-filter-date-range-select',
      'data-filter="range"',
    )}
    ${sel('df-batch', 'Batch', batchOpts(true), f.batch, 'dashboard-filter-batch-select', 'data-filter="batch"')}
    ${sel('df-course', 'Course', [['all', 'All courses']].concat(S.courses.map((c) => [c.id, c.name])), f.course, 'dashboard-filter-course-select', 'data-filter="course"')}
    ${sel('df-exam', 'Exam', [['all', 'All exams']].concat(S.exams.map((x) => [x.id, x.name])), f.exam, 'dashboard-filter-exam-select', 'data-filter="exam"')}
    <button type="button" class="btn btn-ghost btn-sm" data-act="reset-filters" ${active ? '' : 'disabled'} data-testid="dashboard-filter-reset-btn">Reset filters</button></div></section>`;
    }
    function lineChart(vals, mx, o = {}) {
      const W = 640,
        H = 210,
        P = 30,
        n = vals.length,
        stroke = o.stroke || 'var(--accent)',
        grid = o.grid || 'var(--border)',
        txt = o.text || 'var(--muted)';
      const x = (i) => (n === 1 ? W / 2 : P + (i * (W - 2 * P)) / (n - 1)),
        y = (v) => H - P - (v / mx) * (H - 2 * P);
      const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '),
        pk = vals.indexOf(mx);
      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Results per day, peak ${mx}">${[0, 0.5, 1].map((t) => `<line x1="${P}" x2="${W - P}" y1="${y(mx * t).toFixed(1)}" y2="${y(mx * t).toFixed(1)}" stroke="${grid}" stroke-width="1"/><text x="${P - 6}" y="${(y(mx * t) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="${txt}">${Math.round(mx * t)}</text>`).join('')}
  ${n > 1 ? `<polygon points="${x(0).toFixed(1)},${H - P} ${pts} ${x(n - 1).toFixed(1)},${H - P}" fill="${stroke}" fill-opacity="0.15"/><polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
  ${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === pk ? 5 : 2.5}" fill="${i === pk ? o.peak || 'var(--focus)' : stroke}"/>`).join('')}<text x="${x(pk).toFixed(1)}" y="${(y(mx) - 10).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${o.ink || 'var(--ink)'}">${mx}</text></svg>`;
    }
    function ring(pct, lbl, color, key) {
      const p = pct == null ? 0 : pct;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px" data-testid="dashboard-tile-${key}"><div style="width:124px;height:124px;border-radius:50%;background:conic-gradient(${color} 0 ${p}%, var(--bg) ${p}% 100%);display:grid;place-items:center"><div style="width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center"><b class="num" style="font-size:24px;font-family:var(--display)" data-testid="dashboard-tile-${key}-value">${pct == null ? '—' : pct + '%'}</b></div></div><span style="font-weight:700">${lbl}</span></div>`;
    }
    function attentionRows(d) {
      const rows = [];
      d.drafts.forEach((x) => {
        const miss = [];
        if (!x.qs.length) miss.push('no questions');
        if (x.assign.mode !== 'everyone' && !x.assign.batches.length) miss.push('not assigned');
        if (!x.opens) miss.push('no exam window');
        if (miss.length)
          rows.push([
            `<a href="#exam-${x.id}">${e(x.name)}</a> is a draft with ${miss.join(', ')}`,
            'butter',
            'file',
          ]);
      });
      if (d.notInvited)
        rows.push([
          `${d.notInvited} ${d.notInvited === 1 ? 'student has' : 'students have'} not been invited. <a href="#students">Invite</a>`,
          'sky',
          'mail',
        ]);
      if (d.noBatch)
        rows.push([
          `${d.noBatch} ${d.noBatch === 1 ? 'student has' : 'students have'} no batch and won't receive exams. <a href="#students">Fix</a>`,
          'pink',
          'users',
        ]);
      S.live
        .filter((l) => liveState(l) === 'past' && !l.rec)
        .forEach((l) =>
          rows.push([
            `${e(l.title)} ended without a recording. <a href="#live">Add one</a>`,
            'lav',
            'video',
          ]),
        );
      return (
        rows
          .map(
            (r) =>
              `<div class="list-row" data-testid="dashboard-attention-row"><span class="sq" style="background:var(--${r[1]});color:var(--${r[1]}-ink)">${ic(r[2], 16)}</span><span class="grow">${r[0]}</span></div>`,
          )
          .join('') || '<div class="empty"><b>All clear</b>Nothing needs your attention.</div>'
      );
    }
    const resultsTable = (rs) =>
      `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Result</th><th>Submitted</th></tr></thead><tbody>${rs
        .map((r) => {
          const x = exam(r.exam),
            p = r.score >= x.pass;
          return `<tr data-testid="result-row" data-entity-id="${e(r.roll + '-' + r.exam)}" data-state="${p ? 'passed' : 'failed'}"><td><b>${e(r.st)}</b><span class="sub">Roll ${e(r.roll)}</span></td><td>${e(x.name)}</td><td class="num"><b>${r.score}%</b></td><td><span class="pill ${p ? 'b-ok' : 'b-bad'}">${p ? 'Passed' : 'Failed'}</span></td><td class="num">${fmtDate(r.when)} ${fmtTime(r.when.slice(11))}</td></tr>`;
        })
        .join('')}</tbody></table></div>`;

    /* Command centre: KPI strip, line chart, today's agenda, needs-attention */
    function vDashCommand() {

      `<div style="display:flex;flex-direction:column;gap:6px" data-testid="question-options">${q.options.map((o, i) => `<div class="opt${show && i === q.correct ? ' correct' : ''}" style="cursor:default;padding:10px 12px" data-testid="question-option" data-entity-id="${i + 1}" data-selected="${show && i === q.correct}"><span class="k">${LET[i]}</span><span style="flex:1">${e(o)}</span>${show && i === q.correct ? '<span class="pill b-ok">Correct</span>' : ''}</div>`).join('')}</div>`;
    const qPath = (q) =>
      `${e(courseOfSubj(q.subject)?.name)} › ${e(subj(q.subject)?.name)} › ${e(topicName(q.topic))}`;
    const qbHead = (desc) =>
      ph(
        'Question Bank',
        'Question Bank',
        desc,
        `<a class="btn btn-primary" href="#question-new" data-testid="questions-new-btn">${ic('plus')}New question</a>`,
      );
    const chipRow = (k, opts) =>
      `<div class="chips" role="group" aria-label="Filter by ${k === 'diff' ? 'difficulty' : k}">${opts.map((o) => `<button type="button" class="chip" data-act="qb-chip" data-k="${k}" data-v="${o}" aria-pressed="${S.ui.qFilter[k] === o}" data-testid="questions-filter-${k}-chip" data-value="${o}">${o}</button>`).join('')}</div>`;
    function qbFiltered() {
      const f = S.ui.qFilter;
      return S.questions.filter(
        (q) =>
          (f.subject === 'all' || q.subject === f.subject) &&
          (f.diff === 'all' || q.diff === f.diff) &&
          (f.status === 'all' || q.status === f.status) &&
          (!f.q || q.text.toLowerCase().includes(f.q.toLowerCase())),
      );
    }
    function qActions(q) {
      if (VS().qdel === q.id)
        return `<div class="confirm-row" data-testid="questions-delete-confirm"><span>Delete this question?</span><span style="display:flex;gap:8px"><button type="button" class="btn btn-danger btn-sm" data-act="qb-del" data-id="${q.id}" data-testid="questions-delete-confirm-btn">Delete</button><button type="button" class="btn btn-ghost btn-sm" data-act="qb-cancel" data-testid="questions-delete-cancel-btn">Cancel</button></span></div>`;
      return `<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-secondary btn-sm" href="#question-${q.id}" data-testid="questions-edit-btn">${ic('edit', 14)}Edit</a><button type="button" class="btn btn-ghost btn-sm" data-act="qb-toggle" data-id="${q.id}" data-testid="questions-toggle-status-btn">${q.status === 'Published' ? 'Move to draft' : 'Publish'}</button><button type="button" class="btn btn-ghost btn-sm" data-act="qb-dup" data-id="${q.id}" data-testid="questions-duplicate-btn">${ic('copy', 14)}Duplicate</button><button type="button" class="btn btn-ghost btn-sm" data-act="qb-del-ask" data-id="${q.id}" data-testid="questions-delete-btn">${ic('trash', 14)}Delete</button></div>`;
    }
    function dockForm(dr) {
      const F_ = ensureForm(dr.ent, dr.pid || '', dr.extra),
        sp = SPEC[dr.ent],
        prefix = `${dr.ent}-form`;
      return `<aside class="card dock" data-testid="${prefix}-panel" aria-label="New ${e(sp.title.toLowerCase())}"><div class="card-h"><h2>New ${e(sp.title.toLowerCase())}</h2><button type="button" class="icon-btn" data-act="drawer-close" aria-label="Close panel" data-testid="${prefix}-close-btn">✕</button></div>
  <form data-act-submit="fsave" data-testid="${prefix}" novalidate style="display:flex;flex-direction:column;gap:16px">${errSummary(prefix)}${formBody(dr.ent, F_.v, { prefix, flat: true })}
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn btn-ghost btn-sm" data-act="drawer-close" data-testid="${prefix}-cancel-btn">Cancel</button><button type="submit" class="btn btn-primary btn-sm" data-testid="${prefix}-save-btn">${e(dr.ent === 'question' ? 'Save and publish' : 'Add ' + sp.title.toLowerCase())}</button></div></form></aside>`;
    }

    /* ===== Aurora · COLUMNS: finder-style courses → subjects → topics, details panel on the right ===== */
    function vSylColumns() {
      const v = VS();
      const c = course(v.col1) || S.courses[0];
      if (c) v.col1 = c.id;
      const s = c && (c.subjects.find((x) => x.id === v.col2) || c.subjects[0]);
      v.col2 = s ? s.id : null;
      const col = (
        title,
        kind,
        items,
        selId,
        addEnt,
        pid,
        tid,
      ) => `<section class="card" style="padding:14px;gap:8px;min-width:0" data-testid="${tid}"><div class="card-h"><h2 style="font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)">${title} · ${items.length}</h2>${addEnt ? `<button type="button" class="btn btn-secondary btn-sm" data-act="col-add" data-ent="${addEnt}" data-pid="${pid || ''}" data-testid="${tid}-add-btn">${ic('plus', 14)}Add</button>` : ''}</div>
    ${items.map((it) => `<button type="button" class="col-item${selId === it.id ? ' on' : ''}" data-act="col-pick" data-kind="${kind}" data-id="${it.id}" aria-pressed="${selId === it.id}" data-testid="${tid}-item" data-entity-id="${it.id}"><span style="min-width:0;flex:1"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(it.name)}</b><span class="sub">${it.meta}</span></span>${kind !== 'topic' ? ic('chev', 16) : ''}</button>`).join('') || '<div class="empty"><b>Nothing here yet</b>Use Add to create one.</div>'}</section>`;
      const courses = S.courses.map((x) => ({
        id: x.id,
        name: x.name,
        meta: `${e(x.code)} · ${x.subjects.length} subjects`,
      }));
      const subjects = c
        ? c.subjects.map((x) => ({
            id: x.id,
            name: x.name,
            meta: `${e(x.code)} · ${x.topics.length} topics · ${qCountSubj(x.id)} Q`,
          }))
        : [];
      const topics = s
        ? s.topics.map((t) => ({ id: t.id, name: t.name, meta: `${topicQ(t.id)} questions` }))
        : [];
      let right = '';
      if (v.panel) {
        const F_ = ensureForm(v.panel.ent, v.panel.pid || ''),
          sp = SPEC[v.panel.ent],
          prefix = `${v.panel.ent}-form`;
        right = `<form class="inline-form" style="box-shadow:none" data-act-submit="fsave" data-testid="${prefix}" novalidate><div class="if-h"><span class="pill b-lav">New ${e(sp.title.toLowerCase())}</span><button type="button" class="icon-btn" data-act="col-close" aria-label="Close panel" data-testid="${prefix}-close-btn">✕</button></div>${errSummary(prefix)}${formBody(v.panel.ent, F_.v, { prefix, flat: true })}<div class="if-f"><span class="hint">* required</span><div class="btns"><button type="button" class="btn btn-ghost btn-sm" data-act="col-close" data-testid="${prefix}-cancel-btn">Cancel</button><button type="submit" class="btn btn-primary btn-sm" data-testid="${prefix}-save-btn">Add ${e(sp.title.toLowerCase())}</button></div></div></form>`;
      } else {
        const t = s && s.topics.find((x) => x.id === v.col3);
        const it = t
          ? {
              k: 'Topic',
              n: t.name,
              rows: [
                ['Subject', s.name],
                ['Course', c.name],
                ['Questions', topicQ(t.id)],
              ],
            }
          : s
            ? {
                k: 'Subject',
                n: s.name,
                rows: [
                  ['Code', s.code],
                  ['Course', c.name],
                  ['Topics', s.topics.length],
                  ['Questions', qCountSubj(s.id)],
                ],
              }
            : c
              ? {
                  k: 'Course',
                  n: c.name,
                  rows: [
                    ['Code', c.code],
                    ['Subjects', c.subjects.length],
                  ],
                }
              : null;
        right = it
          ? `<section class="card" data-testid="columns-details"><span class="eyebrow">${it.k}</span><h2 style="font-size:22px">${e(it.n)}</h2>${it.rows.map((r) => `<div class="list-row" style="justify-content:space-between"><span class="hint">${r[0]}</span><b>${e(r[1])}</b></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap">${c ? `<a class="btn btn-ghost btn-sm" href="#form-course-${c.id}" data-testid="columns-details-edit-course-btn">${ic('edit', 14)}Edit course</a>` : ''}<a class="btn btn-secondary btn-sm" href="#questions" data-testid="columns-details-questions-link">See questions</a></div></section>`
          : '';
      }
      return `${ph(SYL, SYL, 'Works like folders: pick a course, then a subject, then a topic. Add from the top of any column — the form opens on the right.')}
  <section class="row2" style="align-items:flex-start" data-testid="columns-browser">
    <div style="flex:3 1 640px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${col('Courses', 'course', courses, c && c.id, 'course', '', 'columns-courses')}${col('Subjects', 'subject', subjects, s && s.id, c ? 'subject' : '', c && c.id, 'columns-subjects')}${col('Topics', 'topic', topics, v.col3, s ? 'topic' : '', s && s.id, 'columns-topics')}</div>
    <div style="flex:1 1 320px;min-width:0">${right}</div></section>`;
    }
    /* Aurora · SPLIT question bank: list on the left, full preview on the right */
    function vQBSplit() {
      const v = VS(),
        list = qbFiltered(),
        q = list.find((x) => x.id === v.qsel) || list[0];
      return `${qbHead('Browse on the left; read the full question, its answer and actions on the right.')}
  <section class="row2" style="align-items:flex-start" data-testid="questions-split">
    <div class="card" style="flex:1 1 320px;gap:12px" data-testid="questions-list-pane"><div class="field"><label for="qf-q">Search</label><input class="input" id="qf-q" type="search" value="${e(S.ui.qFilter.q)}" placeholder="Search question text" data-live="qsearch" data-testid="questions-search-input"></div>${chipRow('diff', ['Easy', 'Medium', 'Hard'])}${chipRow('status', ['Published', 'Draft'])}<span class="hint">${list.length} of ${S.questions.length} questions</span>
      <div style="display:flex;flex-direction:column;gap:4px;max-height:620px;overflow:auto">${list.map((x, i) => `<button type="button" class="col-item${q && q.id === x.id ? ' on' : ''}" style="align-items:flex-start" data-act="qb-pick" data-id="${x.id}" aria-pressed="${!!(q && q.id === x.id)}" data-testid="questions-row" data-entity-id="${x.id}" data-state="${x.status.toLowerCase()}"><span class="num" style="font-weight:800;width:22px">${i + 1}</span><span style="flex:1;min-width:0"><b class="clamp2">${e(x.text)}</b><span class="sub">${e(subj(x.subject)?.name)} · ${x.diff} · ${x.status}</span></span></button>`).join('') || '<div class="empty"><b>No questions match</b>Clear a filter.</div>'}</div></div>
    <div class="card" style="flex:2 1 460px;min-width:0" data-testid="questions-preview">${q ? `<span class="hint">${qPath(q)}</span><h2 style="font-size:22px;line-height:1.35">${e(q.text)}</h2>${optList(q)}<div class="chips">${diffPill(q.diff)}${statusPill(q.status)}<span class="pill b-neutral">${e(q.type)}</span><span class="pill b-lav">+${q.marks} / −${q.neg}</span></div>${qActions(q)}` : '<div class="empty"><b>Select a question</b></div>'}</div></section>`;
    }

    /* ===== Ledger · CATALOGUE: course cards → course page; add with a step-by-step wizard ===== */
    function wizardView() {
      const w = VS().wiz,
        sp = SPEC[w.ent],
        F_ = ensureForm(w.ent, w.pid),
        prefix = `${w.ent}-form`,
        secs = sp.sections,
        last = w.step >= secs.length;
      const steps = secs.map((s) => s.s).concat(['Review']);
      const review = last
        ? secs
            .map(
              (s) =>
                `<div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${e(s.s)}</span>${s.f
                  .filter((f) => !f.show || f.show(F_.v))
                  .map((f) => {
                    const x = F_.v[f.k];
                    let shown = Array.isArray(x)
                      ? x.join(', ')
                      : f.t === 'check'
                        ? x
                          ? 'Yes'
                          : 'No'
                        : x;
                    if (f.t === 'select' && x) {
                      const os = typeof f.o === 'function' ? f.o(F_.v) : f.o;
                      shown = (os.find((o) => o[0] === x) || [0, x])[1];
                    }
                    return `<div class="list-row" style="justify-content:space-between" data-testid="${prefix}-review-row"><span class="hint">${e(f.l)}</span><b>${e(shown || '—')}</b></div>`;
                  })
                  .join('')}</div>`,
            )
            .join('')
        : '';
      return `<section class="card" style="gap:18px" data-testid="${prefix}-wizard"><div class="card-h"><h2>New ${e(sp.title.toLowerCase())}${w.pid && course(w.pid) ? ' in ' + e(course(w.pid).name) : ''}</h2><button type="button" class="btn btn-ghost btn-sm" data-act="wiz-cancel" data-testid="${prefix}-cancel-btn">Cancel</button></div>
  <nav class="stepper" aria-label="Steps">${steps.map((s, i) => `<button type="button" class="step${i < w.step ? ' done' : ''}" ${i === w.step ? 'aria-current="step"' : ''} data-act="wiz-go" data-i="${i}" data-testid="${prefix}-step-${i + 1}"><span class="n">${i < w.step ? '✓' : i + 1}</span>${e(s)}</button>`).join('')}</nav>
  ${errSummary(prefix)}
  ${last ? review : `<form data-act-submit="wiz-next" novalidate data-testid="${prefix}">${formBody(w.ent, F_.v, { prefix, flat: true, only: w.step })}</form>`}
  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px"><button type="button" class="btn btn-ghost" data-act="wiz-back" ${w.step === 0 ? 'disabled' : ''} data-testid="${prefix}-back-btn">Back</button>${last ? `<button type="button" class="btn btn-primary" data-act="fsave" data-testid="${prefix}-save-btn">Create ${e(sp.title.toLowerCase())}</button>` : `<button type="button" class="btn btn-primary" data-act="wiz-next" data-testid="${prefix}-next-btn">Next: ${e(steps[w.step + 1])}</button>`}</div></section>`;
    }
    function libCourse(c) {
      return `${ph(`<button type="button" class="linkish" data-act="lib-back" data-testid="catalogue-back-btn">${e(SYL)}</button> › ${e(c.name)}`, e(c.name), `${e(c.code)} · ${c.subjects.length} subjects · ${c.subjects.reduce((a, s) => a + s.topics.length, 0)} topics · ${qOfCourse(c).length} questions in the bank`, `<a class="btn btn-ghost" href="#form-course-${c.id}" data-testid="catalogue-edit-course-btn">${ic('edit')}Edit course</a><button type="button" class="btn btn-primary" data-act="wiz-start" data-ent="subject" data-pid="${c.id}" data-testid="catalogue-add-subject-btn">${ic('plus')}Add subject</button>`)}
  ${
    c.subjects
      .map(
        (
          s,
        ) => `<section class="card" data-testid="catalogue-subject" data-entity-id="${s.id}" data-entity-code="${s.code}"><button type="button" class="card-h" style="background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;width:100%" data-act="lib-toggle" data-id="${s.id}" aria-expanded="${!!s.open}" data-testid="catalogue-subject-toggle-btn"><h2><span class="code on-row">${e(s.code)}</span> ${e(s.name)}</h2><span class="sub">${s.topics.length} topics · ${qCountSubj(s.id)} questions ${s.open ? '▾' : '▸'}</span></button>
    ${
      s.open
        ? `<div class="tbl-wrap"><table class="tbl" style="min-width:420px"><thead><tr><th>Topic</th><th>Questions</th></tr></thead><tbody>${s.topics.map((t) => `<tr data-testid="catalogue-topic-row" data-entity-id="${t.id}"><td><b>${e(t.name)}</b></td><td class="num">${topicQ(t.id)}</td></tr>`).join('') || '<tr><td colspan="2"><span class="hint">No topics yet</span></td></tr>'}</tbody></table></div>
    <form class="form-row" data-act-submit="lib-topic" data-sid="${s.id}" style="align-items:flex-end" novalidate data-testid="catalogue-topic-form"><div class="field" style="flex:2 1 220px"><label for="lt-${s.id}">New topic in ${e(s.name)}</label><input class="input" id="lt-${s.id}" placeholder="e.g. Synchronous Motors" data-testid="catalogue-topic-name-input"></div><button type="submit" class="btn btn-secondary" data-testid="catalogue-topic-add-btn">Add topic</button><a class="btn btn-ghost" href="#form-topic-${s.id}" data-testid="catalogue-topic-all-details-link">All details</a></form>`
        : ''
    }</section>`,
      )
      .join('') ||
    '<div class="card"><div class="empty"><b>No subjects yet</b>Use Add subject.</div></div>'
  }`;
    }
    function vSylCatalogue() {
      const v = VS();
      if (v.wiz)
        return `${ph(`<button type="button" class="linkish" data-act="wiz-cancel" data-testid="catalogue-wizard-back-btn">${e(SYL)}</button> › New ${e(SPEC[v.wiz.ent].title.toLowerCase())}`, `New ${e(SPEC[v.wiz.ent].title.toLowerCase())}`, 'A few short steps, then a review before anything is created.')}${wizardView()}`;
      if (v.lib && course(v.lib)) return libCourse(course(v.lib));
      return `${ph(SYL, SYL, 'Every course on the shelf. Open a card to see its subjects and topics.', `<button type="button" class="btn btn-primary" data-act="wiz-start" data-ent="course" data-testid="catalogue-add-course-btn">${ic('plus')}New course</button>`)}
  <section class="grid g3" data-testid="catalogue-grid">${S.courses
    .map((c, i) => {
      const t = TONES.at(i % 6),
        tps = c.subjects.reduce((a, s) => a + s.topics.length, 0);
      return `<button type="button" class="lib-card" data-act="lib-open" data-id="${c.id}" data-testid="catalogue-course-card" data-entity-id="${c.id}" data-entity-code="${c.code}"><div class="lib-cover" style="background:var(--${t});color:var(--${t}-ink)"><span class="code">${e(c.code)}</span><span style="font-family:var(--display);font-size:30px;font-weight:600;line-height:1.05">${e(c.name)}</span></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%"><span>${c.subjects.length} subjects · ${tps} topics</span><span class="hint">${qOfCourse(c).length} questions in the bank</span><span class="eyebrow" style="margin-top:6px">Open course →</span></div></button>`;
    })
    .join('')}
  <button type="button" class="lib-card add" data-act="wiz-start" data-ent="course" data-testid="catalogue-add-course-card"><span class="sq" style="width:44px;height:44px;font-size:24px" aria-hidden="true">+</span><b>New course</b><span class="hint">Basics · Duration · Fees, then review</span></button></section>`;
    }
    /* Ledger · DRILL question bank: course cards → subject tabs → question cards */
    function vQBDrill() {
      const v = VS(),
        c = course(v.qbCourse);
      if (!c)
        return `${qbHead('Start with a course. Each card shows how many questions it has and how hard they are.')}
  <section class="grid g3" data-testid="questions-course-cards">${S.courses
    .map((x, i) => {
      const qs = qOfCourse(x),
        pub = qs.filter((q) => q.status === 'Published').length,
        ez = qs.filter((q) => q.diff === 'Easy').length,
        md = qs.filter((q) => q.diff === 'Medium').length,
        hd = qs.length - ez - md,
        t = TONES.at(i % 6),
        w = (n) => (qs.length ? (n / qs.length) * 100 : 0);
      return `<button type="button" class="lib-card" data-act="qb-course" data-id="${x.id}" data-testid="questions-course-card" data-entity-id="${x.id}" data-entity-code="${x.code}"><div class="lib-cover" style="background:var(--${t});color:var(--${t}-ink);min-height:100px"><span class="code">${e(x.code)}</span><span style="font-family:var(--display);font-size:28px;font-weight:600">${e(x.name)}</span></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;width:100%"><b class="num" style="font-size:24px">${qs.length} questions</b><span class="hint">${pub} published · ${qs.length - pub} draft · ${x.subjects.length} subjects</span><div style="display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--row)" role="img" aria-label="${ez} easy, ${md} medium, ${hd} hard"><i style="width:${w(ez)}%;background:var(--mint-ink)"></i><i style="width:${w(md)}%;background:var(--butter-ink)"></i><i style="width:${w(hd)}%;background:var(--danger)"></i></div><span class="hint">${ez} easy · ${md} medium · ${hd} hard</span></div></button>`;
    })
    .join('')}
  <a class="lib-card add" href="#question-new" data-testid="questions-new-card"><span class="sq" style="width:44px;height:44px;font-size:24px" aria-hidden="true">+</span><b>New question</b><span class="hint">Opens the full question form</span></a></section>`;
      const sid = v.qbSubj || 'all',
        all = qOfCourse(c);
      const list = all.filter(
        (q) =>
          (sid === 'all' || q.subject === sid) &&
          (S.ui.qFilter.diff === 'all' || q.diff === S.ui.qFilter.diff),
      );
      return `${ph(`<button type="button" class="linkish" data-act="qb-course" data-id="" data-testid="questions-back-to-courses-btn">Question Bank</button> › ${e(c.name)}`, `${e(c.name)} questions`, `${all.length} questions · ${all.filter((q) => q.status === 'Published').length} published`, `<button type="button" class="btn btn-ghost" data-act="qb-course" data-id="" data-testid="questions-all-courses-btn">All courses</button><a class="btn btn-primary" href="#question-new" data-testid="questions-new-btn">${ic('plus')}New question</a>`)}
  <div class="tabs" role="tablist" aria-label="Subject">${[['all', 'All subjects', all.length]]
    .concat(c.subjects.map((s) => [s.id, s.name, qCountSubj(s.id)]))
    .map(
      (t) =>
        `<button type="button" role="tab" class="tab" aria-selected="${sid === t[0]}" data-act="qb-subj" data-id="${t[0]}" data-testid="questions-subject-tab" data-value="${t[0]}">${e(t[1])}<span class="n num">${t[2]}</span></button>`,
    )

        : '';

    /* Grid · TABLE question bank: dense, sortable, bulk actions */
    function vQBTable() {

        status: (q) => q.status,
      };
      if (key[sk])
        list = list.slice().sort((a, b) => {
          const x = key[sk](a),

  ${list.map((q, i) => `<tr data-testid="questions-row" data-entity-id="${q.id}" data-state="${q.status.toLowerCase()}" data-selected="${v.sel.includes(q.id)}"><td><input type="checkbox" aria-label="Select question ${i + 1}" ${v.sel.includes(q.id) ? 'checked' : ''} data-act="qb-check" data-id="${q.id}" data-testid="questions-row-checkbox"></td><td class="num">${i + 1}</td><td style="max-width:380px"><b>${e(q.text)}</b><span class="sub">${e(topicName(q.topic))}</span></td><td>${e(subj(q.subject)?.name)}</td><td>${diffPill(q.diff)}</td><td class="num">+${q.marks} / −${q.neg}</td><td>${statusPill(q.status)}</td><td><div class="acts"><button type="button" class="btn btn-ghost btn-sm" data-act="qb-expand" data-id="${q.id}" aria-expanded="${v.exp === q.id}" data-testid="questions-row-expand-btn">${v.exp === q.id ? 'Hide' : 'Options'}</button><a class="btn btn-ghost btn-sm" href="#question-${q.id}" data-testid="questions-row-edit-btn">Edit</a></div></td></tr>${v.exp === q.id ? `<tr data-testid="questions-row-details"><td colspan="8">${optList(q)}</td></tr>` : ''}`).join('') || '<tr><td colspan="8"><div class="empty"><b>No questions match</b></div></td></tr>'}</tbody></table></div><span class="hint">${list.length} of ${S.questions.length} questions</span></section>`;

        return `<section class="card conv" data-testid="${prefix}-conversation">${head}<span class="eyebrow">All set</span><h2>Here's your new ${e(sp.title.toLowerCase())}</h2><div style="display:flex;flex-direction:column;gap:6px">${steps

          })

            '',
          )}</div>${errSummary(prefix)}<div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><button type="button" class="btn btn-ghost" data-act="conv-back" data-testid="${prefix}-back-btn">Back</button><button type="button" class="btn btn-primary" data-act="fsave" data-testid="${prefix}-save-btn">Create ${e(sp.title.toLowerCase())}</button></div></section>`;
      const st = steps[c.i],

      let ctl;

      return `<section class="card conv" data-testid="${prefix}-conversation">${head}<span class="eyebrow">Question ${c.i + 1} of ${steps.length}</span><form data-act-submit="conv-next" novalidate style="display:flex;flex-direction:column;gap:14px"><h2 id="conv-q">${e(st.q)}</h2>${ctl}${err ? `<span class="hint bad" data-testid="${prefix}-${kebab(st.k)}-error">${e(err)}</span>` : st.h ? `<span class="hint">${e(st.h)}</span>` : ''}<div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center"><button type="button" class="btn btn-ghost" data-act="conv-back" ${c.i === 0 ? 'disabled' : ''} data-testid="${prefix}-back-btn">Back</button><span class="kbd">Press Enter ↵</span><button type="submit" class="btn btn-primary" data-testid="${prefix}-next-btn">OK, next</button></div></form></section>`;
